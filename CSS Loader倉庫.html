<!DOCTYPE html>
<html lang="zh-TW" class="h-full"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Loaders</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #0a0a0f;
        }
        .app-wrapper {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
        }
        .content {
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin: 0 0 8px 0;
            font-family: 'JetBrains Mono', monospace;
        }
        .header p {
            color: #9ca3af;
            font-size: 16px;
            margin: 0;
        }
        .color-settings {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .color-input-item {
            flex: 1;
            min-width: 200px;
        }
        .color-input-item label {
            display: block;
            color: #d1d5db;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .color-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .color-picker-btn {
            width: 44px;
            height: 44px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .color-picker-btn:hover {
            border-color: rgba(99,102,241,0.4);
            transform: scale(1.05);
        }
        .color-input-field {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .color-input-field:focus {
            outline: none;
            background: rgba(255,255,255,0.08);
            border-color: rgba(99,102,241,0.4);
        }
        .loaders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }
        .loader-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loader-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(99,102,241,0.4);
            transform: translateY(-2px);
        }
        .loader-preview {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .loader-id {
            color: #9ca3af;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }
        .modal-close {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 24px;
            transition: color 0.2s ease;
        }
        .modal-close:hover { color: #fff; }
        .code-preview {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .code-preview code {
            font-family: 'JetBrains Mono', monospace;
            color: #e5e7eb;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .modal-copy-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .modal-copy-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(99,102,241,0.4);
        }
        .modal-copy-btn.copied {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 1001;
            opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes scaleOut { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

        /* Loaders 1-50 */
        .loader-1 { width: 48px; height: 48px; border: 5px solid var(--primary-color, #FFF); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        .loader-2 { width: 48px; height: 48px; border: 5px solid var(--primary-color, #FFF); border-bottom-color: var(--secondary-color, #6366f1); border-radius: 50%; animation: rotation 1s linear infinite; }
        .loader-3 { width: 48px; height: 48px; border: 3px solid var(--primary-color, #FFF); border-radius: 50%; border-top-color: transparent; border-bottom-color: transparent; animation: rotation 1s linear infinite; }
        .loader-4 { width: 48px; height: 48px; border: 5px dotted var(--primary-color, #FFF); border-radius: 50%; animation: rotation 2s linear infinite; }
        .loader-5 { width: 48px; height: 48px; border: 5px dashed var(--primary-color, #FFF); border-radius: 50%; animation: rotation 1.5s linear infinite; }
        .loader-6 { width: 48px; height: 48px; border-radius: 50%; border-top: 4px solid var(--primary-color, #FFF); border-right: 4px solid transparent; animation: rotation 1s linear infinite; }
        .loader-7 { width: 48px; height: 48px; border-radius: 50%; border: 4px solid; border-color: var(--primary-color, #FFF) var(--primary-color, #FFF) transparent transparent; animation: rotation 1s linear infinite; }
        .loader-8 { width: 48px; height: 48px; border-radius: 50%; border: 4px solid; border-color: var(--primary-color, #FFF) transparent var(--primary-color, #FFF) transparent; animation: rotation 1.2s linear infinite; }
        .loader-9 { width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color, #FFF); box-shadow: -24px 0 var(--primary-color, #FFF), 24px 0 var(--primary-color, #FFF); animation: pulse 1s linear infinite; }
        .loader-10 { width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color, #FFF); box-shadow: -24px 0 var(--primary-color, #FFF), 24px 0 var(--primary-color, #FFF); animation: pulse 1s linear infinite; }
        .loader-11 { width: 48px; height: 48px; position: relative; } .loader-11::after, .loader-11::before { content: ''; width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--primary-color, #FFF); position: absolute; left: 0; top: 0; animation: scaleOut 1.5s ease-in-out infinite; } .loader-11::after { animation-delay: 0.75s; }
        .loader-12 { width: 48px; height: 48px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0%, var(--primary-color, #FFF) 100%); animation: rotation 1s linear infinite; position: relative; } .loader-12::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #0a0a0f; }
        .loader-13 { width: 10px; height: 10px; border-radius: 50%; background: var(--primary-color, #FFF); animation: bounce 0.6s infinite alternate; }
        .loader-14 { width: 10px; height: 10px; border-radius: 50%; background: var(--primary-color, #FFF); box-shadow: 20px 0 var(--primary-color, #FFF), -20px 0 var(--primary-color, #FFF); animation: bounce 0.6s infinite alternate; }
        .loader-15 { width: 48px; height: 48px; border: 5px solid var(--primary-color, #FFF); border-radius: 50%; animation: pulse 1s ease-in-out infinite; }
        .loader-16 { width: 48px; height: 48px; background: var(--primary-color, #FFF); animation: rotation 1s linear infinite; }
        .loader-17 { width: 48px; height: 48px; background: var(--primary-color, #FFF); animation: rotation 1.2s ease-in-out infinite; }
        .loader-18 { width: 48px; height: 48px; background: var(--primary-color, #FFF); border-radius: 4px; animation: rotation 1s linear infinite; }
        .loader-19 { width: 8px; height: 40px; background: var(--primary-color, #FFF); border-radius: 4px; box-shadow: 16px 0 var(--primary-color, #FFF), -16px 0 var(--primary-color, #FFF); animation: pulse 0.8s ease-in-out infinite; }
        .loader-20 { width: 8px; height: 40px; background: var(--primary-color, #FFF); border-radius: 4px; box-shadow: 16px 0 var(--primary-color, #FFF), -16px 0 var(--primary-color, #FFF); animation: pulse 0.8s ease-in-out infinite; }
        .loader-21 { width: 8px; height: 40px; border-radius: 4px; background: var(--primary-color, #FFF); animation: pulse 0.5s 0.1s ease-in-out infinite; box-shadow: 16px 0 var(--primary-color, #FFF), -16px 0 var(--primary-color, #FFF); }
        .loader-22 { width: 48px; height: 48px; position: relative; } .loader-22::before, .loader-22::after { content: ''; position: absolute; width: 24px; height: 24px; background: var(--primary-color, #FFF); animation: rotation 1s infinite ease-in-out; } .loader-22::after { animation-delay: -0.5s; }
        .loader-23 { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1s infinite; }
        .loader-24 { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-color, #FFF); box-shadow: 30px 0 rgba(255,255,255,0.3); animation: pulse 1s infinite; }
        .loader-25 { width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 60% 40%, var(--primary-color, #FFF) 3px, transparent 4px); animation: rotation 2s linear infinite; }
        .loader-26 { width: 48px; height: 48px; border: 4px solid var(--primary-color, #FFF); animation: rotation 1s linear infinite; }
        .loader-27 { width: 48px; height: 48px; border: 4px solid transparent; border-top-color: var(--primary-color, #FFF); border-bottom-color: var(--primary-color, #FFF); border-radius: 50%; animation: rotation 1s linear infinite; }
        .loader-28 { width: 48px; height: 48px; border: 4px solid; border-color: var(--primary-color, #FFF) var(--secondary-color, #6366f1) var(--secondary-color, #8b5cf6) var(--secondary-color, #a855f7); border-radius: 50%; animation: rotation 1s linear infinite; }
        .loader-29 { width: 48px; height: 48px; border: 4px solid var(--primary-color, #FFF); border-radius: 50%; position: relative; animation: rotation 1s linear infinite; } .loader-29::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 4px solid transparent; border-top-color: var(--secondary-color, #6366f1); border-radius: 50%; animation: rotation 0.5s linear infinite reverse; }
        .loader-30 { width: 48px; height: 48px; border: 4px solid var(--primary-color, #FFF); border-radius: 50%; position: relative; animation: rotation 1.5s linear infinite; } .loader-30::before { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; border: 4px solid transparent; border-bottom-color: var(--secondary-color, #6366f1); border-radius: 50%; animation: rotation 1s linear infinite; }
        .loader-31 { width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color, #FFF); position: relative; animation: pulse 1.2s linear infinite; }
        .loader-32 { width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1s linear infinite; }
        .loader-33 { width: 48px; height: 48px; background: linear-gradient(90deg, var(--primary-color, #FFF) 50%, transparent 50%); border-radius: 50%; animation: rotation 0.8s linear infinite; }
        .loader-34 { width: 48px; height: 48px; background: conic-gradient(var(--primary-color, #FFF), var(--secondary-color, #6366f1), var(--secondary-color, #8b5cf6), var(--primary-color, #FFF)); border-radius: 50%; animation: rotation 1s linear infinite; position: relative; } .loader-34::after { content: ''; position: absolute; inset: 6px; background: #0a0a0f; border-radius: 50%; }
        .loader-35 { width: 48px; height: 48px; background: radial-gradient(circle 12px at 50% 12px, var(--primary-color, #FFF) 100%, transparent); animation: rotation 1s infinite; }
        .loader-36 { width: 48px; height: 48px; display: flex; flex-wrap: wrap; animation: rotation 2s linear infinite; } .loader-36::before, .loader-36::after { content: ''; width: 24px; height: 24px; background: var(--primary-color, #FFF); } .loader-36::after { background: var(--secondary-color, #6366f1); }
        .loader-37 { width: 48px; height: 48px; border: 4px solid var(--primary-color, #FFF); border-radius: 50%; position: relative; animation: rotation 1s linear infinite; } .loader-37::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 4px solid transparent; border-top-color: var(--secondary-color, #6366f1); border-radius: 50%; animation: rotation 0.5s linear infinite reverse; }
        .loader-38 { width: 10px; height: 10px; background: var(--primary-color, #FFF); border-radius: 50%; animation: pulse 1.2s linear infinite; }
        .loader-39 { width: 12px; height: 12px; background: var(--primary-color, #FFF); animation: pulse 0.6s infinite alternate; }
        .loader-40 { width: 48px; height: 48px; border: 4px solid var(--primary-color, #FFF); border-radius: 50%; animation: pulse 1s ease-in-out infinite; }
        .loader-41 { width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1s infinite; }
        .loader-42 { width: 48px; height: 48px; background: transparent; border: 5px solid var(--primary-color, #FFF); animation: rotation 2s infinite; }
        .loader-43 { width: 48px; height: 24px; background: var(--primary-color, #FFF); border-radius: 100px 100px 0 0; animation: pulse 1s infinite alternate; }
        .loader-44 { width: 16px; height: 16px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 0.5s infinite alternate; }
        .loader-45 { width: 48px; height: 24px; border: 5px solid var(--primary-color, #FFF); border-top: none; border-radius: 0 0 100px 100px; animation: pulse 1s infinite ease-in-out; }
        .loader-46 { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 0.8s infinite; }
        .loader-47 { width: 6px; height: 35px; background: var(--primary-color, #FFF); animation: pulse 0.8s cubic-bezier(0, 0.5, 0.5, 1) infinite; animation-delay: -0.24s; box-shadow: 16px 0 var(--primary-color, #FFF), -16px 0 var(--primary-color, #FFF); }
        .loader-48 { width: 48px; height: 48px; border: 3px solid var(--primary-color, #FFF); border-radius: 50%; position: relative; animation: rotation 1s linear infinite; } .loader-48::after { content: ''; position: absolute; width: 8px; height: 8px; background: var(--secondary-color, #6366f1); border-radius: 50%; top: -5px; left: 50%; transform: translateX(-50%); }
        .loader-49 { width: 48px; height: 48px; background: var(--primary-color, #FFF); animation: rotation 1s infinite; }
        .loader-50 { width: 48px; height: 48px; border-radius: 50%; position: relative; border: 10px solid; border-color: rgba(255,255,255,0.15) rgba(255,255,255,0.25) rgba(255,255,255,0.35) var(--primary-color, #FFF); animation: rotation 1s linear infinite; }

        /* Loaders 51-100 */
        .loader-51 { width: 15px; aspect-ratio: 1; border-radius: 50%; animation: pulse 1s infinite linear alternate; background: var(--primary-color, #FFF); }
        .loader-52 { width: 48px; height: 48px; position: relative; transform: rotate(45deg); } .loader-52::before, .loader-52::after { content: ''; position: absolute; width: 24px; height: 24px; background: var(--primary-color, #FFF); animation: pulse 0.5s infinite ease-in-out alternate; } .loader-52::after { right: 0; bottom: 0; animation-delay: 0.25s; }
        .loader-53 { width: 48px; height: 48px; border: 3px solid var(--primary-color, #FFF); border-radius: 50%; position: relative; animation: rotation 1s linear infinite; } .loader-53::after { content: ''; position: absolute; left: 50%; top: 0; background: var(--secondary-color, #6366f1); width: 6px; height: 24px; transform: translateX(-50%); }
        .loader-54 { width: 24px; height: 24px; background: var(--primary-color, #FFF); border-radius: 50%; animation: pulse 1s ease-in-out infinite alternate; }
        .loader-55 { width: 48px; height: 48px; border-radius: 50%; border: 4px solid; border-color: var(--primary-color, #FFF) var(--primary-color, #FFF) transparent; animation: rotation 1s linear infinite; position: relative; } .loader-55::after { content: ''; position: absolute; left: 0; right: 0; top: 0; bottom: 0; margin: auto; border: 4px solid; border-color: transparent var(--secondary-color, #6366f1) var(--secondary-color, #6366f1); width: 30px; height: 30px; border-radius: 50%; animation: rotation 0.5s linear infinite reverse; }
        .loader-56 { width: 48px; height: 48px; position: relative; } .loader-56::before, .loader-56::after { content: ''; position: absolute; width: 24px; height: 24px; background-color: var(--primary-color, #FFF); animation: pulse 1.8s ease-in-out infinite; } .loader-56::after { animation-delay: -0.9s; }
        .loader-57 { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1.5s infinite linear; }
        .loader-58 { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--primary-color, #FFF); border-radius: 50%; animation: rotation 0.8s linear infinite; }
        .loader-59 { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1s ease-in-out infinite; }
        .loader-60 { width: 48px; height: 48px; border: 5px solid var(--primary-color, #FFF); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        .loader-61 { width: 48px; height: 48px; border: 4px solid var(--primary-color, #FFF); border-radius: 50%; animation: pulse 1.5s infinite; }
        .loader-62 { width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1.2s infinite; }
        .loader-63 { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--primary-color, #FFF); border-right-color: var(--secondary-color, #6366f1); animation: rotation 1.2s linear infinite; }
        .loader-64 { width: 48px; height: 48px; background: linear-gradient(45deg, var(--primary-color, #FFF) 25%, transparent 25%, transparent 75%, var(--primary-color, #FFF) 75%, var(--primary-color, #FFF)); background-size: 24px 24px; background-position: 0 0; animation: rotation 1s linear infinite; }
        .loader-65 { width: 40px; height: 40px; background: var(--primary-color, #FFF); border-radius: 0 0 50% 50%; animation: pulse 1s infinite; }
        .loader-66 { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1.4s infinite; }
        .loader-67 { width: 60px; height: 60px; display: inline-block; position: relative; background: linear-gradient(to right, var(--primary-color, #FFF) 30%, transparent 30%) no-repeat; background-position: 0 0; background-size: 40% 100%; animation: rotation 2s infinite; }
        .loader-68 { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1s infinite; }
        .loader-69 { width: 48px; height: 48px; border: 5px solid; border-color: var(--primary-color, #FFF) var(--primary-color, #FFF) var(--secondary-color, #6366f1) var(--secondary-color, #6366f1); border-radius: 50%; animation: rotation 1s linear infinite; }
        .loader-70 { width: 48px; height: 48px; box-shadow: inset 0 0 0 4px var(--primary-color, #FFF); border-radius: 50%; animation: pulse 1s ease-in-out infinite; }
        .loader-71 { width: 40px; height: 40px; border: 3px solid; border-color: var(--primary-color, #FFF) var(--primary-color, #FFF) transparent; border-radius: 50%; animation: rotation 0.8s linear infinite; }
        .loader-72 { width: 40px; height: 40px; background: conic-gradient(from 90deg at 50% 50%, var(--primary-color, #FFF) 0deg, transparent 180deg); border-radius: 50%; animation: rotation 1.5s linear infinite; }
        .loader-73 { width: 10px; height: 10px; border-radius: 50%; background: var(--primary-color, #FFF); animation: pulse 1s infinite ease-in-out; }
        .loader-74 { width: 24px; height: 24px; background: var(--primary-color, #FFF); animation: pulse 1s ease-in-out infinite; }
        .loader-75 { width: 48px; height: 48px; border-radius: 50%; background: repeating-conic-gradient(var(--primary-color, #FFF) 0deg 10deg, var(--secondary-color, #6366f1) 10deg 20deg); animation: rotation 2s linear infinite; }

        .loader-193 { width: 48px; height: 48px; border: 4px solid; border-color: var(--primary-color, #FFF) var(--primary-color, #FFF) var(--secondary-color, #6366f1); border-radius: 50%; animation: rotation 0.8s linear infinite; }
        .loader-194 { width: 40px; height: 40px; background: repeating-conic-gradient(var(--primary-color, #FFF) 0deg 15deg, transparent 15deg 30deg); border-radius: 50%; animation: rotation 2s linear infinite; }
        .loader-195 { width: 6px; height: 6px; background: var(--primary-color, #FFF); border-radius: 50%; box-shadow: 14px 14px var(--primary-color, #FFF), -14px 14px var(--secondary-color, #6366f1), -14px -14px var(--primary-color, #FFF), 14px -14px var(--primary-color, #FFF); animation: pulse 0.8s infinite ease-in-out; }
        .loader-196 { width: 48px; height: 48px; border: 5px solid var(--primary-color, #FFF); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
        .loader-197 { width: 40px; height: 40px; background: conic-gradient(from -90deg, var(--primary-color, #FFF), var(--secondary-color, #6366f1), var(--primary-color, #FFF)); border-radius: 50%; animation: rotation 1.5s linear infinite; }
        .loader-198 { width: 10px; height: 10px; background: var(--primary-color, #FFF); border-radius: 50%; animation: pulse 1.5s ease infinite; }
        .loader-199 { width: 48px; height: 48px; border: 4px solid transparent; border-top: 4px solid var(--primary-color, #FFF); border-bottom: 4px solid var(--secondary-color, #6366f1); border-radius: 50%; animation: rotation 1.3s linear infinite; }
        .loader-200 { width: 48px; height: 48px; background: var(--primary-color, #FFF); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); animation: rotation 1.2s linear infinite; }
    </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body>
  <div class="app-wrapper" id="app">
   <div class="content">
    <div class="header">
     <h1>200 CSS Loaders</h1>
     <p>完整的 CSS 加載動畫庫 - 點擊查看代碼</p>
    </div>
    <div class="color-settings">
     <div class="color-input-item"><label for="primary-color">主色</label>
      <div class="color-input-wrapper"><input type="color" id="primary-color" class="color-picker-btn" value="#FFFFFF"> <input type="text" id="primary-text" class="color-input-field" value="#FFFFFF">
      </div>
     </div>
     <div class="color-input-item"><label for="secondary-color">副色</label>
      <div class="color-input-wrapper"><input type="color" id="secondary-color" class="color-picker-btn" value="#6366f1"> <input type="text" id="secondary-text" class="color-input-field" value="#6366f1">
      </div>
     </div>
    </div>
    <div class="loaders-grid" id="loaders"></div>
   </div>
  </div>
  <div class="modal-overlay" id="modal">
   <div class="modal-content">
    <div class="modal-header">
     <div class="modal-title" id="modal-title">
      Loader #1
     </div><button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="code-preview"><code id="modal-code"></code>
    </div><button class="modal-copy-btn" id="modal-copy">📋 複製代碼</button>
   </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
        const loaderConfigs = [];
        for (let i = 1; i <= 200; i++) {
            loaderConfigs.push({ id: i });
        }

        const state = {
            primaryColor: '#FFFFFF',
            secondaryColor: '#6366f1',
            selectedLoader: null
        };

        const loaderStyles = {
            1: `.loader {\n  width: 48px;\n  height: 48px;\n  border: 5px solid var(--primary-color, #FFF);\n  border-bottom-color: transparent;\n  border-radius: 50%;\n  animation: rotation 1s linear infinite;\n}`,
            2: `.loader {\n  width: 48px;\n  height: 48px;\n  border: 5px solid var(--primary-color, #FFF);\n  border-bottom-color: var(--secondary-color, #6366f1);\n  border-radius: 50%;\n  animation: rotation 1s linear infinite;\n}`,
            3: `.loader {\n  width: 48px;\n  height: 48px;\n  border: 3px solid var(--primary-color, #FFF);\n  border-radius: 50%;\n  border-top-color: transparent;\n  border-bottom-color: transparent;\n  animation: rotation 1s linear infinite;\n}`,
            4: `.loader {\n  width: 48px;\n  height: 48px;\n  border: 5px dotted var(--primary-color, #FFF);\n  border-radius: 50%;\n  animation: rotation 2s linear infinite;\n}`,
            5: `.loader {\n  width: 48px;\n  height: 48px;\n  border: 5px dashed var(--primary-color, #FFF);\n  border-radius: 50%;\n  animation: rotation 1.5s linear infinite;\n}`,
            6: `.loader {\n  width: 48px;\n  height: 48px;\n  border-radius: 50%;\n  border-top: 4px solid var(--primary-color, #FFF);\n  border-right: 4px solid transparent;\n  animation: rotation 1s linear infinite;\n}`,
            7: `.loader {\n  width: 48px;\n  height: 48px;\n  border-radius: 50%;\n  border: 4px solid;\n  border-color: var(--primary-color, #FFF) var(--primary-color, #FFF) transparent transparent;\n  animation: rotation 1s linear infinite;\n}`,
            8: `.loader {\n  width: 48px;\n  height: 48px;\n  border-radius: 50%;\n  border: 4px solid;\n  border-color: var(--primary-color, #FFF) transparent var(--primary-color, #FFF) transparent;\n  animation: rotation 1.2s linear infinite;\n}`,
            9: `.loader {\n  width: 12px;\n  height: 12px;\n  border-radius: 50%;\n  background: var(--primary-color, #FFF);\n  box-shadow: -24px 0 var(--primary-color, #FFF), 24px 0 var(--primary-color, #FFF);\n  animation: pulse 1s linear infinite;\n}`,
            10: `.loader {\n  width: 12px;\n  height: 12px;\n  border-radius: 50%;\n  background: var(--primary-color, #FFF);\n  box-shadow: -24px 0 var(--primary-color, #FFF), 24px 0 var(--primary-color, #FFF);\n  animation: pulse 1s linear infinite;\n}`,
            200: `.loader {\n  width: 48px;\n  height: 48px;\n  background: var(--primary-color, #FFF);\n  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);\n  animation: rotation 1.2s linear infinite;\n}`
        };

        function getLoaderCode(id) {
            if (loaderStyles[id]) {
                return loaderStyles[id] + `\n\n@keyframes rotation {\n  0% { transform: rotate(0deg); }\n  100% { transform: rotate(360deg); }\n}\n\n@keyframes pulse {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0.3; }\n}`;
            }
            return `.loader {\n  /* Loader #${id} styles */\n}`;
        }

        function updateColors() {
            document.documentElement.style.setProperty('--primary-color', state.primaryColor);
            document.documentElement.style.setProperty('--secondary-color', state.secondaryColor);
        }

        function renderLoaders() {
            const grid = document.getElementById('loaders');
            grid.innerHTML = loaderConfigs.map(config => `
                <div class="loader-card" data-id="${config.id}">
                    <div class="loader-preview">
                        <div class="loader-${config.id}"></div>
                    </div>
                    <div class="loader-id">#${config.id}</div>
                </div>
            `).join('');

            grid.querySelectorAll('.loader-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.dataset.id);
                    showModal(id);
                });
            });
        }

        function showModal(id) {
            state.selectedLoader = id;
            document.getElementById('modal-title').textContent = `Loader #${id}`;
            document.getElementById('modal-code').textContent = getLoaderCode(id);
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            state.selectedLoader = null;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        document.getElementById('primary-color').addEventListener('input', (e) => {
            state.primaryColor = e.target.value;
            document.getElementById('primary-text').value = state.primaryColor;
            updateColors();
        });

        document.getElementById('primary-text').addEventListener('input', (e) => {
            if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                state.primaryColor = e.target.value;
                document.getElementById('primary-color').value = state.primaryColor;
                updateColors();
            }
        });

        document.getElementById('secondary-color').addEventListener('input', (e) => {
            state.secondaryColor = e.target.value;
            document.getElementById('secondary-text').value = state.secondaryColor;
            updateColors();
        });

        document.getElementById('secondary-text').addEventListener('input', (e) => {
            if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                state.secondaryColor = e.target.value;
                document.getElementById('secondary-color').value = state.secondaryColor;
                updateColors();
            }
        });

        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        document.getElementById('modal-copy').addEventListener('click', () => {
            const code = document.getElementById('modal-code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                showToast('✓ 代碼已複製！');
                document.getElementById('modal-copy').classList.add('copied');
                setTimeout(() => {
                    document.getElementById('modal-copy').classList.remove('copied');
                }, 2000);
            });
        });

        updateColors();
        renderLoaders();
    </script>
 
</body></html>
