<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Dev Studio | 程式碼合成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #4facfe;
            --accent-secondary: #00f2fe;
            --text-main: #e0e0e0;
            --html-color: #ff6b6b;
            --css-color: #48dbfb;
            --js-color: #feca57;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; font-weight: 300; }
        h1 b { color: var(--accent-primary); font-weight: 800; }

        .controls {
            display: flex;
            gap: 15px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            align-items: center;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .input-side {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 15px;
        }

        .output-side {
            display: grid;
            grid-template-rows: 1.2fr 1fr;
            gap: 15px;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .card-header {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .disabled {
            opacity: 0.2;
            filter: grayscale(1) blur(2px);
            pointer-events: none;
            transform: scale(0.98);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 15px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        .btn-action {
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: #fff;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        .btn-upload {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-upload:hover { background: rgba(255, 255, 255, 0.2); }

        .svg-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>MODERN<b>STUDIO</b> 合成器</h1>
        <div class="controls">
            <label class="checkbox-item"><input type="checkbox" id="checkHtml" checked onchange="updateUI()"> HTML</label>
            <label class="checkbox-item"><input type="checkbox" id="checkCss" checked onchange="updateUI()"> CSS</label>
            <label class="checkbox-item"><input type="checkbox" id="checkJs" checked onchange="updateUI()"> JS</label>
            <button class="btn-action" onclick="runMerge()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M13 10V3L4 14H11V21L20 10H13Z"/></svg>
                合成並預覽
            </button>
        </div>
    </header>

    <div class="main-layout">
        <div class="input-side">
            <div class="glass-card" id="boxHtml">
                <div class="card-header" style="border-left: 4px solid var(--html-color);">
                    <span><i class="fab fa-html5"></i> HTML Body</span>
                    <label class="btn-upload">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                        上傳
                        <input type="file" hidden accept=".html,.htm,.txt" onchange="loadFile(this, 'inputHtml', 'html')">
                    </label>
                </div>
                <textarea id="inputHtml" placeholder="/* 貼上 HTML 結構 */"></textarea>
            </div>

            <div class="glass-card" id="boxCss">
                <div class="card-header" style="border-left: 4px solid var(--css-color);">
                    <span><i class="fab fa-css3-alt"></i> CSS Styles</span>
                    <label class="btn-upload">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                        上傳
                        <input type="file" hidden accept=".css,.txt" onchange="loadFile(this, 'inputCss', 'css')">
                    </label>
                </div>
                <textarea id="inputCss" placeholder="/* 貼上 CSS 樣式 */"></textarea>
            </div>

            <div class="glass-card" id="boxJs">
                <div class="card-header" style="border-left: 4px solid var(--js-color);">
                    <span><i class="fab fa-js"></i> JavaScript</span>
                    <label class="btn-upload">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                        上傳
                        <input type="file" hidden accept=".js,.txt,application/javascript,text/javascript" onchange="loadFile(this, 'inputJs', 'js')">
                    </label>
                </div>
                <textarea id="inputJs" placeholder="/* 貼上 JS 邏輯 */"></textarea>
            </div>
        </div>

        <div class="output-side">
            <div class="glass-card">
                <div class="card-header">
                    <span><i class="fas fa-code"></i> 合成代碼</span>
                    <button class="btn-upload" onclick="copyCode()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        點擊複製
                    </button>
                </div>
                <textarea id="outputCode" readonly style="color: #a9b7c6; background: rgba(0,0,0,0.3);"></textarea>
            </div>

            <div class="glass-card">
                <div class="card-header">
                    <span><i class="fas fa-eye"></i> 即時預覽</span>
                </div>
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        function updateUI() {
            const sections = ['Html', 'Css', 'Js'];
            sections.forEach(s => {
                document.getElementById(`box${s}`).classList.toggle('disabled', !document.getElementById(`check${s}`).checked);
            });
        }

        function loadFile(input, targetId, type) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                let content = e.target.result;
                if (type === 'html' && content.includes('<body')) {
                    const match = content.match(/<body[^>]*>([\s\S]*)<\/body>/i);
                    if (match) content = match[1].trim();
                }
                document.getElementById(targetId).value = content;
                input.value = ''; // 清除 value 讓同一檔案可重複上傳
            };
            reader.readAsText(file);
        }

        function runMerge() {
            const useHtml = document.getElementById('checkHtml').checked;
            const useCss = document.getElementById('checkCss').checked;
            const useJs = document.getElementById('checkJs').checked;

            const html = useHtml ? document.getElementById('inputHtml').value : "";
            const css = useCss ? document.getElementById('inputCss').value : "";
            const js = useJs ? document.getElementById('inputJs').value : "";

            const finalCode = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>${css}<\/style>
</head>
<body>
${html}
<script>${js}<\/script>
</body>
</html>`;

            document.getElementById('outputCode').value = finalCode;
            const frame = document.getElementById('previewFrame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            doc.open();
            doc.write(finalCode);
            doc.close();
        }

        function copyCode() {
            const output = document.getElementById('outputCode');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            alert("代碼已複製到剪貼簿！");
        }

        updateUI();
    </script>
</body>
</html>
