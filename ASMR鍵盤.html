    body {
      box-sizing: border-box;
    }
    
    * {
      font-family: 'Noto Sans TC', sans-serif;
    }
    
    .key {
      transition: all 0.08s ease-out;
      box-shadow: 
        0 4px 0 #1a1a2e,
        0 6px 10px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    
    .key:active, .key.pressed {
      transform: translateY(4px);
      box-shadow: 
        0 0 0 #1a1a2e,
        0 2px 5px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    
    .key::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.6) 0%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
    }
    
    .key.ripple::after {
      animation: ripple 0.4s ease-out;
    }
    
    @keyframes ripple {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
      }
      100% {
        width: 200%;
        height: 200%;
        opacity: 0;
      }
    }
    
    .glow-effect {
      animation: glow 0.3s ease-out;
    }
    
    @keyframes glow {
      0% {
        box-shadow: 
          0 4px 0 #1a1a2e,
          0 6px 10px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 0 20px rgba(167, 139, 250, 0.8);
      }
      100% {
        box-shadow: 
          0 4px 0 #1a1a2e,
          0 6px 10px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
    }
    
    .floating {
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .pulse-ring {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      border: 2px solid rgba(167, 139, 250, 0.6);
      animation: pulse-ring 0.6s ease-out forwards;
    }
    
    @keyframes pulse-ring {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(2);
        opacity: 0;
      }
    }
    
    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 20px;
      animation: particle-float 1s ease-out forwards;
    }
    
    @keyframes particle-float {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% - 60px)) scale(0.5);
      }
    }
    
    .toggle-btn {
      transition: all 0.3s ease;
    }
    
    .toggle-btn.active {
      background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
    }
    
    .keyboard-container {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center top;
    }
    
    .keyboard-container.hidden {
      opacity: 0;
      transform: scaleY(0);
      height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>

        const now = audioContext.currentTime;
        const p = soundProfiles[currentSoundType];
        
        // Triple oscillator setup for richer harmonics
        const osc1 = audioContext.createOscillator();
        const gain1 = audioContext.createGain();
        osc1.type = 'sine';
        osc1.frequency.value = p.f1 + (Math.random() * 10 - 5); // Slight detuning
        osc1.connect(gain1);
        gain1.connect(masterGain);
        
        const osc2 = audioContext.createOscillator();
        const gain2 = audioContext.createGain();
        osc2.type = 'sine';
        osc2.frequency.value = p.f2 + (Math.random() * 10 - 5);
        osc2.connect(gain2);
        gain2.connect(masterGain);
        
        const osc3 = audioContext.createOscillator();
        const gain3 = audioContext.createGain();
        osc3.type = 'triangle';
        osc3.frequency.value = p.f3 + (Math.random() * 10 - 5);
        osc3.connect(gain3);
        gain3.connect(masterGain);
        
        // Enhanced noise with filtering
        const bufferSize = audioContext.sampleRate * p.dur;
        const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * p.noise;
        }
        const noise = audioContext.createBufferSource();
        const noiseGain = audioContext.createGain();
        const noiseFilter = audioContext.createBiquadFilter();
        noiseFilter.type = 'lowpass';
        noiseFilter.frequency.value = p.f2 * 1.5;
        noise.buffer = buffer;
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(masterGain);
        
        // Advanced ADSR envelopes with individual attack/decay
        const attackTime = p.attack * p.dur;
        const decayStart = attackTime;
        const releaseStart = p.dur * (1 - p.decay);
        
        // Oscillator 1 envelope - fundamental
        gain1.gain.setValueAtTime(0.001, now);
        gain1.gain.exponentialRampToValueAtTime(p.vol * 0.8, now + attackTime);
        gain1.gain.exponentialRampToValueAtTime(p.vol * 0.4, now + decayStart + (p.dur * 0.2));
        gain1.gain.exponentialRampToValueAtTime(0.001, now + p.dur);
        
        // Oscillator 2 envelope - harmonic
        gain2.gain.setValueAtTime(0.001, now);
        gain2.gain.exponentialRampToValueAtTime(p.vol * 0.4, now + attackTime);
        gain2.gain.exponentialRampToValueAtTime(p.vol * 0.2, now + decayStart + (p.dur * 0.15));
        gain2.gain.exponentialRampToValueAtTime(0.001, now + p.dur * 0.85);
        
        // Oscillator 3 envelope - brightness
        gain3.gain.setValueAtTime(0.001, now);
        gain3.gain.exponentialRampToValueAtTime(p.vol * 0.25, now + attackTime * 0.5);
        gain3.gain.exponentialRampToValueAtTime(0.001, now + p.dur * 0.6);
        
        // Noise envelope - transient
        noiseGain.gain.setValueAtTime(p.vol * 0.4, now);
        noiseGain.gain.exponentialRampToValueAtTime(p.vol * 0.1, now + attackTime * 2);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + p.dur * 0.4);
        
        // Start and stop all sources
        osc1.start(now);
        osc1.stop(now + p.dur);
        osc2.start(now);
        osc2.stop(now + p.dur);
        osc3.start(now);
        osc3.stop(now + p.dur);
        noise.start(now);
        noise.stop(now + p.dur);
        
      } catch (e) {
        console.log('Sound error:', e);
      }
    }
    
    let audioInitialized = false;
    
    function ensureAudio() {
      if (!audioInitialized) {
        initAudio();
        audioInitialized = true;
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }
    
    document.addEventListener('click', ensureAudio, { once: false });
    document.addEventListener('keydown', ensureAudio, { once: false });
    
    function triggerKeyEffect(key, x, y) {
      playKeySound();
      
      const keyElement = document.querySelector(`[data-key="${key.toUpperCase()}"]`) || 
                        document.querySelector(`[data-key="${key}"]`);
      
      if (keyElement && keyboardVisible) {
        keyElement.classList.add('pressed', 'ripple', 'glow-effect');
        setTimeout(() => {
          keyElement.classList.remove('pressed', 'ripple', 'glow-effect');
        }, 150);
      }
      
      createPulseRing(x, y);
      createParticle(x, y);
    }
    
    function createPulseRing(x, y) {
      const ring = document.createElement('div');
      ring.className = 'pulse-ring';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      ring.style.width = '60px';
      ring.style.height = '60px';
      document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 600);
    }
    
    function createParticle(x, y) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.textContent = particles[Math.floor(Math.random() * particles.length)];
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 1000);
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const x = window.innerWidth / 2 + (Math.random() - 0.5) * 100;
      const y = window.innerHeight / 2 + (Math.random() - 0.5) * 50;
      triggerKeyEffect(e.key, x, y);
    });
    
    function setupKeyboardListeners() {
      document.querySelectorAll('.key').forEach(key => {
        key.addEventListener('mousedown', function(e) {
          e.preventDefault();
          const rect = this.getBoundingClientRect();
          triggerKeyEffect(this.dataset.key, rect.left + rect.width / 2, rect.top + rect.height / 2);
        });
        key.addEventListener('touchstart', function(e) {
          e.preventDefault();
          const touch = e.touches[0];
          triggerKeyEffect(this.dataset.key, touch.clientX, touch.clientY);
        }, { passive: false });
      });
    }
    
    setupKeyboardListeners();
    
    document.getElementById('sound-select').addEventListener('change', (e) => {
      currentSoundType = e.target.value;
    });
    
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeText = document.getElementById('theme-text');
    const themeIcon = document.getElementById('theme-icon');
    
    function applyTheme() {
      const keyboardContainer = document.getElementById('keyboard-container');
      const keys = document.querySelectorAll('.key');
      
      if (isDarkMode) {
        document.body.className = 'h-full bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 overflow-auto';
        themeToggleBtn.classList.add('active');
        themeText.textContent = '白色模式';
        themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';
        keyboardContainer.style.background = 'rgba(30, 41, 59, 0.5)';
        keys.forEach(key => {
          key.style.background = 'linear-gradient(to bottom, rgb(51, 65, 85), rgb(30, 41, 59))';
          key.style.color = 'rgba(241, 245, 249, 0.9)';
        });
        document.getElementById('main-title').className = 'text-3xl sm:text-4xl md:text-5xl font-light text-white/90 mb-3 tracking-wide';
      } else {
        document.body.className = 'h-full bg-gradient-to-br from-slate-50 via-purple-100 to-slate-100 overflow-auto';
        themeToggleBtn.classList.remove('active');
        themeText.textContent = '黑色模式';
        themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
        keyboardContainer.style.background = 'rgba(241, 245, 249, 0.8)';
        keys.forEach(key => {
          key.style.background = 'linear-gradient(to bottom, rgb(226, 232, 240), rgb(203, 213, 225))';
          key.style.color = 'rgba(30, 41, 59, 0.9)';
        });
        document.getElementById('main-title').className = 'text-3xl sm:text-4xl md:text-5xl font-light text-slate-800 mb-3 tracking-wide';
      }
    }
    
    themeToggleBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      applyTheme();
    });
    
    const toggleBtn = document.getElementById('toggle-keyboard');
    const toggleText = document.getElementById('toggle-text');
    const toggleIcon = document.getElementById('toggle-icon');
    const keyboardContainer = document.getElementById('keyboard-container');
    
    toggleBtn.addEventListener('click', () => {
      keyboardVisible = !keyboardVisible;
      if (keyboardVisible) {
        keyboardContainer.classList.remove('hidden');
        toggleBtn.classList.add('active');
        toggleText.textContent = '隱藏螢幕鍵盤';
        toggleIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
      } else {
        keyboardContainer.classList.add('hidden');
        toggleBtn.classList.remove('active');
        toggleText.textContent = '顯示螢幕鍵盤';
        toggleIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
      }
    });
    
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          document.getElementById('main-title').textContent = config.title_text || defaultConfig.title_text;
          if (config.font_family) {
            document.body.style.fontFamily = `${config.font_family}, ${defaultConfig.font_family}, sans-serif`;
          }
        },
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ['title_text', config.title_text || defaultConfig.title_text]
        ])
      });
    }
  </script>
